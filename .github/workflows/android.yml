name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Extrair projeto
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir source
          unzip -q *.zip -d source
               
      - name: Verificar arquitetura
        run: |
          find source -name "build.gradle" -o -name "build.gradle.kts"
          grep -RniE 'abiFilters|ANDROID_ABI|APP_ABI|arm64-v8a|armeabi-v7a' source --include='*.gradle' --include='*.kts' --include='CMakeLists.txt' || true
                
      - name: Atualizar versão do Gradle
        run: |
          WRAPPER=$(find source -path "*/gradle/wrapper/gradle-wrapper.properties" -type f | head -n 1)
          if [ -z "$WRAPPER" ]; then
            echo "gradle-wrapper.properties não encontrado"
            exit 1
          fi
          sed -i 's#gradle-[0-9.]*-bin.zip#gradle-8.11.1-all.zip#' "$WRAPPER"

      - name: Baixar dependências do projeto
        run: |
          cd source/Shipwright-Android-9.0.2P2
          rm -rf libultraship OTRExporter ZAPDTR
          git clone --depth 1 --branch mm https://github.com/Waterdish/libultraship.git libultraship
          git clone --depth 1 --branch android_main https://github.com/Waterdish/OTRExporter.git OTRExporter
          git clone --depth 1 --branch mm https://github.com/Waterdish/ZAPDTR.git ZAPDTR

      - name: Compilar APK
        run: |
          GRADLEW=$(find source -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "Não foi encontrado o gradlew"
            exit 1
          fi
          cd "$(dirname "$GRADLEW")"
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Shipwright-APK
          path: source/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
